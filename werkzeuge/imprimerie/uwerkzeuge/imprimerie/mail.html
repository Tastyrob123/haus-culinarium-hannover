<body class="ml-seite">
<div class="ml">
  <header class="ml-kopf">

    <input class="ml-name" id="mlName" aria-label="Name der E-Mail" spellcheck="false">

      <div class="ml-pruef__liste" id="mlPruefListe"></div>
    </details>
    <button class="kn kn--klein kn--ohne" id="mlFenster" title="In einem neuen Fenster ansehen"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span>Ansehen</span></button>

  <aside class="ml-links">
    <a class="ms-lnk ms-lnk--zurueck ml-zurueck" href="index.html"><svg viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></svg><span>Zur Übersicht</span></a>
    <div class="ml-kapitel"><span class="ml-kapitel__z" id="mlKapitelZeichen"></span><h1>Newsletter <span style="white-space:nowrap">&amp; E-Mail</span></h1><p>Versendbar, im Stil des Hauses</p></div>
    <h3>Vorlagen</h3>
    <nav class="ml-vorlagen" id="mlVorlagen"></nav>
    <div id="mlMeineBox" hidden>
      <h3>Meine E-Mails <em id="mlMeineZahl"></em></h3>
      <div class="ml-meine" id="mlMeine"></div>
    </div>
    <h3>Teile der E-Mail</h3>
    <nav class="ml-nav">
      <button data-teil="mail"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4zM4 7l8 6 8-6"/></svg><span>Betreff und Versand</span></button>
      <button data-teil="kopf"><svg viewBox="0 0 24 24"><path d="M4 4h16v7H4zM4 15h16M4 19h10"/></svg><span>Kopf und Kopfbild</span></button>
      <button data-teil="fuss"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 9h10M4 13h16v7H4z"/></svg><span>Fuss mit Adresse</span></button>
    </nav>
  </aside>

  <main class="ml-mitte">
    <div class="ml-buehne" id="mlBuehne">
      <div class="ml-posteingang">
        <span class="ml-pe__zeichen">CU</span>
        <div><b>Culinarium</b><span class="ml-pe__betreff" id="mlBetreff"></span><span class="ml-pe__vorschau" id="mlVorschau"></span></div>
      </div>
      <div class="ml-blatt" id="mlBlatt"><iframe id="mlRahmen" title="Vorschau der E-Mail" scrolling="no"></iframe><span class="ml-blatt__licht"></span></div>
      <span class="ml-boden"></span>
    </div>
  </main>

  <aside class="ml-rechts">
    <h3>Baustein einfügen</h3>
    <div class="ml-einfuegen" id="mlEinfuegen"></div>
    <div class="ml-felder" id="mlFelder"></div>
  </aside>
</div>
