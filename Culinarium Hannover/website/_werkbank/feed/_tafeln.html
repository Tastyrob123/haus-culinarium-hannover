<!doctype html><meta charset="utf-8"><style>@font-face{font-family:'B';src:url('../_werkbank/fonts/Fraunces-Light.ttf') format('truetype')}
@font-face{font-family:'M';src:url('../_werkbank/fonts/DMMono-Regular.ttf') format('truetype')}
@font-face{font-family:'S';src:url('../_werkbank/fonts/InstrumentSans-Regular.ttf') format('truetype')}

*{box-sizing:border-box;margin:0;padding:0}
body{background:#333333}
.k{position:relative;width:1080px;height:1350px;overflow:hidden;margin:0 0 20px;font-family:'B',Georgia,serif}
.k--t,.k--e{background:#222028 url(/assets/zeichen/tapete-dunkel.svg) 50% 50%/360px auto;color:#faf4f4}
.k--a{background:#faf4f4;color:#222028}
/* das Raster zeigt 3:4, also 34 px weniger je Seite: der Rahmen hält Abstand */
.k i.r{position:absolute;inset:86px 96px;border:1.5px solid rgba(239,118,73,.62)}
.k--a i.r{border-color:rgba(136,67,41,.6)}
.k .ce{position:absolute;left:0;right:0;top:170px;display:flex;justify-content:center}
.k .satz{position:absolute;left:120px;right:120px;top:50%;transform:translateY(-46%);text-align:center;font-size:112px;line-height:1.14;letter-spacing:-.005em}
.k .satz b{font-weight:400;color:#ef7649;display:block}
.k .satz span{display:block}
.k .lin{position:absolute;left:50%;bottom:262px;width:110px;height:2px;margin-left:-55px;background:#ef7649}
.k .kl{position:absolute;left:120px;right:120px;bottom:186px;text-align:center;font-family:'M',monospace;font-size:23px;letter-spacing:.2em;text-transform:uppercase;color:#ef7649}
.k--a .kl{color:#884329}.k--a .lin{background:#ab4721}
.k--a .name{position:absolute;left:0;right:0;top:268px;text-align:center;font-size:92px;line-height:1.1}
.k--a .bild{position:absolute;left:138px;right:138px;top:424px;height:640px;display:flex;align-items:center;justify-content:center}
.k--a .bild img{width:100%;height:100%;object-fit:cover;object-position:var(--op,50% 50%);display:block;border:1.5px solid rgba(34,32,40,.5);padding:12px;background:#fdf9f9}
.k--a .lin{bottom:236px}.k--a .kl{bottom:164px}.k--a .ce{top:150px}
.k--a .bild svg{height:100%;width:auto}
.k--e .et{position:absolute;left:50%;top:50%;width:700px;transform:translate(-50%,-50%) rotate(-5deg)}
.k--e .et img{width:100%;display:block;filter:drop-shadow(0 30px 34px rgba(0,0,0,.5))}
.k--t.hell{background:#faf4f4;color:#222028}
.k--t.hell i.r{border-color:rgba(136,67,41,.6)}.k--t.hell .satz b{color:#884329}.k--t.hell .kl{color:#884329}.k--t.hell .lin{background:#ab4721}
/* Blatt aus der Karte: Stube, Name des Gerichts, seine Zeile und der Preis, wie auf der Karte des Hauses */
.k--k{background:#faf4f4;color:#222028}
.k--k i.r{border-color:rgba(136,67,41,.6)}
.k--k i.r::after{content:'';position:absolute;inset:10px;border:1px solid rgba(136,67,41,.35)}
.k--k .ce{top:158px}
.k--k .mit{position:absolute;left:150px;right:150px;top:330px;bottom:330px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.k--k .name{font-size:104px;line-height:1.08}
.k--k .name span{display:block}
.k--k .zl{margin-top:44px;font-family:'S',Arial,sans-serif;font-size:45px;line-height:1.42;color:rgba(34,32,40,.8);max-width:660px}
.k--k .pr{position:absolute;left:150px;right:150px;bottom:236px;display:flex;align-items:baseline;gap:16px;font-size:62px}
.k--k .pr i{flex:1;border-bottom:3px dotted rgba(34,32,40,.4);transform:translateY(-10px)}
.k--k .pr small{font-family:'M',monospace;font-size:23px;letter-spacing:.2em;text-transform:uppercase;color:#884329}
.k--k .kl{position:absolute;left:120px;right:120px;bottom:160px;text-align:center;font-family:'M',monospace;font-size:21px;letter-spacing:.2em;text-transform:uppercase;color:#884329}
.av{width:640px;height:640px;border-radius:50%;background:#222028 url(/assets/zeichen/tapete-dunkel.svg) 50% 50%/360px auto;display:flex;align-items:center;justify-content:center;position:relative}
.av::after{content:'';position:absolute;inset:34px;border-radius:50%;border:3px solid rgba(239,118,73,.7)}
