name: Probe (Werkzeuge laden?)
on:
  push:
    branches: ['**', '!ergebnis', '!quelle']
  workflow_dispatch:
env:
  PLAYWRIGHT_BROWSERS_PATH: /home/runner/ms-playwright
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[probe]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /home/runner/ms-playwright
          key: pw-1.62.1-webkit-chromium
      - run: bash cloud/vorbereiten.sh "webkit chromium"
      - run: bash cloud/server.sh
      - run: node cloud/probe.js _Werkzeuge/messlauf/ziele-culinarium.json probe
      - name: Messlauf-Probe mit fester Uhr
        env:
          TOR_UHR: '2026-10-31T10:00:00+01:00'
        run: |
          node _Werkzeuge/messlauf/messlauf.js _Werkzeuge/messlauf/ziele-culinarium.json probe/ml --nur schaufenster,gaestebuch --browser webkit --groesse 1440 2>&1 | grep -E "Zustände|FERTIG"
      - if: always()
        run: mkdir -p probe && cp /tmp/server/*.log probe/ 2>/dev/null; true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe
          retention-days: 2
