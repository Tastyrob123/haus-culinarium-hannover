name: Probe und Rest

# Probe zuerst, danach der Rest, alles in der Cloud. Start per Knopf oder Commit auf main mit «[probe-und-rest]»:
#  1. Probe: Gästebuch, 3 Teile, nur Tor (gleichmässige Teilung)
#  2. Nur wenn jeder Probe-Teil erfolgreich und ≤ 15 min: voller Lauf Markenbuch, Gästebuch, Schaufenster
#  3. Parallel die Plakatwerkstatt (öffentlicher Ordner: ohne Minuten-Grenze; privat nur, wenn die Minuten reichen)
# Ergebnisse: Zweig «ergebnis», Ordner ergebnis/laeufe/main-probe, main-voll1, main-voll2.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  probe:
    # Start per Knopf oder Commit auf main mit «[probe-und-rest]» in der Nachricht
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[probe-und-rest]')
    uses: ./.github/workflows/abnahme.yml
    with:
      nur: 'gaestebuch,teile=3,nurtor'
      titel: 'Probe gleichmässige Teilung'
      kennung: 'probe-'

  probe_pruefen:
    needs: probe
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    outputs:
      ok: ${{ steps.p.outputs.ok }}
      mpz: ${{ steps.p.outputs.minuten_je_zustand }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: cloud
      - uses: actions/download-artifact@v4
        with:
          path: probe
          pattern: probe-teil-*
          merge-multiple: true
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 cloud/nacht_pruefen.py probe probe

  voll1:
    needs: probe_pruefen
    if: needs.probe_pruefen.outputs.ok == 'true'
    uses: ./.github/workflows/abnahme.yml
    with:
      nur: 'markenbuch,gaestebuch,schaufenster'
      titel: 'Abnahme Markenbuch, Gästebuch, Schaufenster'
      kennung: 'voll1-'

  budget:
    # Privat: Plakatwerkstatt erst nach Voll 1 und nur, wenn die Minuten reichen. Öffentlich: sofort, ohne Grenze.
    needs: [probe_pruefen]
    if: ${{ !cancelled() && needs.probe_pruefen.outputs.ok == 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      weiter: ${{ steps.b.outputs.weiter }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: cloud
      - id: b
        env:
          GH_TOKEN: ${{ github.token }}
          MPZ: ${{ needs.probe_pruefen.outputs.mpz }}
          OEFFENTLICH: ${{ github.event.repository.private == false }}
        run: python3 cloud/nacht_pruefen.py budget

  voll2:
    needs: budget
    if: needs.budget.outputs.weiter == 'true'
    uses: ./.github/workflows/abnahme.yml
    with:
      nur: 'plakatwerkstatt'
      titel: 'Abnahme Plakatwerkstatt'
      kennung: 'voll2-'
